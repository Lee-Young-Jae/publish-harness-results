<script type="text/javascript">
	/* 외부 라이브러리 없이 동작 — 호스트 페이지의 jQuery/slick 과 충돌하지 않는다 */
	(function () {
		function bind(sec) {
			var el = sec.querySelector('.scr_wrap');
			var a = sec.querySelector('.arrows');
			if (!el || !a) { return; }

			function sync() {
				var max = el.scrollWidth - el.clientWidth;
				var fit = (max <= 1);
				/* 카드가 화면에 다 들어오면 화살표를 숨기고 가운데 정렬 */
				el.className = 'scr_wrap' + (fit ? ' fit' : '');
				a.style.display = fit ? 'none' : '';
				var cls = 'arrows';
				if (!fit && el.scrollLeft >= max - 1) { cls += ' at-end'; }
				if (el.scrollLeft <= 1) { cls += ' at-start'; }
				a.className = cls;
			}

			function slide(dir) {
				var max = el.scrollWidth - el.clientWidth;
				var to = el.scrollLeft + dir * 252;
				if (to < 0) { to = 0; }
				if (to > max) { to = max; }
				var from = el.scrollLeft, t0 = new Date().getTime();
				var timer = setInterval(function () {
					var p = (new Date().getTime() - t0) / 300;
					if (p >= 1) { p = 1; clearInterval(timer); }
					el.scrollLeft = from + (to - from) * (p < 0.5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p));
					sync();
				}, 16);
			}

			a.querySelector('.prev').onclick = function () { slide(-1); };
			a.querySelector('.next').onclick = function () { slide(1); };
			el.onscroll = sync;
			sync();
		}

		function init() {
			var rolls = document.querySelectorAll('#protowrap .roll');
			for (var i = 0; i < rolls.length; i++) { bind(rolls[i]); }
		}

		if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
		else { init(); }
	})();
</script>
