<body class="headerNone"><div id="lotteWrap"><article id="lotteContents" class="newType footerHide"><div class="newEventStyle"><section class="full"><div class="tab_wrap"><div class="full eventTemplet eventTempletNew"><script type="text/javascript">
	$(document).ready(function() {

		/* 면세점 고정 헤더 H */
		var ldfHeaderH = function() {
			var h = 50;
			if ($('#lotteHeader > :first-child').length) {
				if ($('#lotteHeader > :first-child').outerHeight() >= 49) {
					h = $('#lotteHeader > :first-child').outerHeight();
				}
			}
			return h;
		};

		/* 면세점 고정 헤더 Y */
		var ldfHeaderY = function() {
			var y = 0;
			if ($('#lotteHeader > :first-child').length) {
				if ($('#lotteHeader > :first-child')[0].offsetTop > 0) {
					y = $('#lotteHeader > :first-child')[0].offsetTop;
				}
			}
			return y;
		};

		/* 상단 갭 */
		var fixGap = ldfHeaderH() + ldfHeaderY();

		/* 타이머 */
		var fnTimer = null;

		/* 면세점 고정 배너 닫았을 때 */
		if ($('#lotteWrap .app_banner').length) {
			$('#lotteWrap .app_banner').find('.bnr_close').on('click._scrollUpdate', function(e) {
				setTimeout(function() {
					$(window).trigger('scroll');
				}, 0);
			});
		}

		/* TAB 바로가기 */
		$('._fn_goto').on('click', function(e, ele) {
			e.preventDefault();

			var target = $(this).attr('href');

			if (ele) {
				target = ele;
			}

			var $target = $(target);
			var navHeight = $('._evt_nav').length ? $('._evt_nav').height() : 0;
			var goPosition = $target.offset().top - navHeight - fixGap;
			$('html, body').stop().animate({
				scrollTop: goPosition
			}, 400, function() {
			});

		});

		/* TAB 고정 */
		$(window).on('scroll', function(e) {

			var $evt = $('.evWrap');
			var $nav = $('._evt_nav');

			if (fixGap != ldfHeaderH() + ldfHeaderY()) {
				fixGap = ldfHeaderH() + ldfHeaderY();
				$nav.find('._nav_wrap').css('top', fixGap);
			}

			if ($nav.length) {
				var scrollTop = $(this).scrollTop();
				var navHeight = $nav.height();
				var navTop = $nav.offset().top;
				var evtHeight = $evt.offset().top + $evt.height();

				$('._set_ank').each(function(i, v) {
					var $this = $(this);
					var ankOt = parseInt($this.offset().top - 1, 10);
					var secHeight = parseInt($this.parent().offset().top + $this.parent().outerHeight(), 10);

					if ((ankOt - (navHeight + fixGap)) <= scrollTop && scrollTop < (ankOt + secHeight - (navHeight + fixGap))) {
						if (!$nav.find('._nav').eq(i).is('._current')) {
							$nav.find('._nav').eq(i).addClass('_current').siblings().removeClass('_current');

							clearTimeout(fnTimer);
							fnTimer = setTimeout(function() {
								if (typeof _evtNavSwipe != 'undefined') {
									_evtNavSwipe.slideTo(i, 500);
								}
							}, 300);
						}
					}

				});

				if (scrollTop >= navTop - fixGap && (evtHeight) - (fixGap + navHeight) >= scrollTop) {
					if (!$nav.is('._fixed')) {
						$nav.addClass('_fixed').removeClass('_absolute').find('._nav_wrap').css('top', fixGap);
					}
				} else {
					if ($nav.is('._fixed')) {
						$nav.removeClass('_fixed').find('._nav_wrap').css('top', '');
					}
					if ((evtHeight) - (fixGap + navHeight) <= scrollTop) {
						if (!$nav.is('._absolute')) {
							$nav.addClass('_absolute').removeClass('_fixed').find('._nav_wrap').css('top', '');

						}
					}
				}
			}

		});

		/* TAB 스와이프 */
		try {
			var _evtNavSwipe = $('._evt_nav').length ? new Swiper('._evt_nav ._nav_wrap ._nav_inner', {
				slidesPerView: 'auto',
				spaceBetween: 0,
				freeMode: true,
			}) : false;

			var _evtNavSwipeTimer = null;
			$(window).on('resize._evtNavSwiper', function(e) {
				if (_evtNavSwipe) {
					clearTimeout(_evtNavSwipeTimer);
					_evtNavSwipeTimer = setTimeout(function() {
						_evtNavSwipe.update();
					}, 150);
				}
			}).trigger('resize._evtNavSwiper');
		} catch (e) {
			console.error(e);
		}

		try {
			var imgSlider = document.querySelectorAll('._img_slider');
			
			imgSlider.forEach(function(elem){
				var _imgSlider = new Swiper(elem, {
					speed: 600,
					slidesPerView: 1,
					centeredSlides: false,
					spaceBetween: 20,
					pagination: {
						el: elem.querySelector('._img_slider_bullets'),
						type: 'bullets',
						clickable: true,
					}
				});
			});
		} catch (e) {
			console.error(e);
		}
	});
</script>
