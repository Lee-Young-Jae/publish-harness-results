			});

		/* TAB 고정 */
		$(window).on('scroll', function(e) {

			var $evt = $('.evWrap');

			if (fixGap != ldfHeaderH() + ldfHeaderY()) {
				fixGap = ldfHeaderH() + ldfHeaderY();

			}

				var navHeight = $nav.height();
				var navTop = $nav.offset().top;
				var evtHeight = $evt.offset().top + $evt.height();
				$('._set_ank').each(function(i, v) {
					var $this = $(this);
					var ankOt = parseInt($this.position().top, 10);
					var ankPT = parseInt($this.offset().top, 10);
					var ankNxtOt = $this.parent().next('._info_sec').length > 0 ? parseInt($this.parent().next('._info_sec').find('._set_ank').position().top, 10) : 0;
					var secHeight = parseInt($this.parent().height(), 10);

					var gap = (6.53333 * $(window).width()) / 100;
					var gapPx = fixGap - (+(Math.round(gap + 'e+3') + 'e-3'));

					if (ankPT <= Math.round(scrollTop + gapPx) && (ankPT + secHeight) - (ankOt - ankNxtOt) >= Math.round(scrollTop + gapPx)) {
						if (!$nav.find('._nav').eq(i).is('._current')) {
							$nav.find('._nav').eq(i).addClass('_current').siblings().removeClass('_current');

								}
							}, 300);
						}
					}
				});
				if (scrollTop >= navTop - fixGap && (evtHeight) - (fixGap + navHeight) >= scrollTop) {
					if (!$nav.is('._fixed')) {
						$nav.addClass('_fixed').removeClass('_absolute').find('._nav_wrap').css('top', fixGap);

				} else {

					return evtWidth - layerWidth;
				},

					var winGap = 50;

					if ($('._evt_nav').length) {
						winGap = 50 + $('._evt_nav').height();
					}

					var wrapGap = 50;

					var winPos = $(window).scrollTop() - $evtWrap.offset().top;
					var winHeight = winPos < 0 ? $(window).innerHeight() + winPos : $(window).innerHeight();

					var wrapHeight = $evtWrap.height();
					var wrapPosTop = $evtWrap.offset().top;
					var wrapPosBottom = wrapHeight;

					var targetHeight = $target.height();
					var targetPosTop = (winPos + (winHeight / 2)) - (targetHeight / 2);
					var targetPosBottom = targetPosTop + targetHeight;

					if (winHeight > (targetHeight + winGap)) {
						if (winPos > 0) {
							if (targetPosBottom > (wrapPosBottom - wrapGap)) {

								$('html, body').scrollTop(wrapPosBottom - targetHeight - wrapGap - winGap);

								return wrapPosBottom - targetHeight - wrapGap;
							} else {
								return targetPosTop + (winGap / 2);
							}
						} else {
							return (winHeight / 2) - (targetHeight / 2);
						}
					} else {
						if (targetHeight > wrapHeight) {
							return winGap;
						} else {
							if (winPos > 0) {
								if ((winPos + winGap + (winGap / 2) + targetHeight) > (wrapPosBottom - wrapGap)) {

									$('html, body').scrollTop(wrapPosBottom - targetHeight - wrapGap - winGap);

									return wrapPosBottom - targetHeight - wrapGap;
								} else {
									return winPos + winGap + (winGap / 2);
								}
							} else {
								if ((winGap + targetHeight) > (wrapPosBottom - wrapGap)) {

									$('html, body').scrollTop(wrapPosBottom - targetHeight - wrapGap - winGap);

									return wrapPosBottom - targetHeight - wrapGap;
								} else {
									return winGap;
								}
							}
						}
					}
				}
			};

			if ($target.length > 0) {

				var resultTop = (setPos.screenMiddle() / $(window).width() * 100).toFixed(5) + 'vw';
				var resultLeft = (setPos.screenCenter() / $(window).width() * 100).toFixed(5) + 'vw';

				$evtWrap.find('._ev_layer').css({display: 'none', top: '', left: '', marginLeft: '', marginTop: '', opacity: ''}).removeClass('active');

				if (!$(this).is('.active')) {
					$target.css({display: 'block', top: resultTop, left: resultLeft, marginLeft: 0, opacity: 0}).addClass('active').animate({

		});
		$('#evDimmed').on('click', function(e) {
			e.preventDefault();
			$('.evWrap ._ev_layer:visible').find('._close').trigger('click');
		});

		/* 상단 명품관 네비 고정 */
		$(window).on('scroll', function(e) {
			var $evt = $('.evWrap');
			var $nav = $('._cate_nav');

			if ($nav.length) {
				var scrollTop = $(this).scrollTop();
				var evtHeight = $evt.offset().top + $evt.height();

				if ((evtHeight - fixGap) >= scrollTop) {
					if (!$nav.is('._fixed')) {
						$nav.addClass('_fixed').removeClass('_absolute');
					}
				} else {
					if ($nav.is('._fixed')) {
						$nav.removeClass('_fixed');
					}
					if ((evtHeight - fixGap) <= scrollTop) {
						if (!$nav.is('._absolute')) {
							$nav.addClass('_absolute').removeClass('_fixed');
						}
					}
				}
			}

		});

	});
