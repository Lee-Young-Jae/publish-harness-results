				var evtCodeMsg = {
					'0070' : "유효하지 않은 통합회원번호입니다. 등록된 여권 정보를 다시 확인하시거나, 고객센터(1688-3000)로 문의해 주세요.",
					'0012' : "본 프로모션의 대상 국적을 다시 한번 확인해 주세요.",

					'0003' : "오류가 발생했습니다. 고객센터(1688-3000)으로 문의해 주시기 바랍니다.",
					'0001' : "로그인 후 참여 가능합니다.",
					'0099' : "오류가 발생했습니다. 고객센터(1688-3000)으로 문의해 주시기 바랍니다.",
					'0002' : "오류가 발생했습니다. 고객센터(1688-3000)으로 문의해 주시기 바랍니다.",
					'1999' : "이미 다운로드되었습니다. 마이페이지 > 내 지갑에서 확인하세요.",
					'1998' : "이미 다운로드되었습니다. 마이페이지 > 내 지갑에서 확인하세요.",
					'1997' : "이미 다른 언어 페이지에서 다운로드하신 내역이 있습니다. 중복 참여는 불가합니다.",
					'1996' : "이미 다른 언어 페이지에서 다운로드하신 내역이 있습니다. 중복 참여는 불가합니다.",
					'0004' : "오류가 발생했습니다.(코드: 0004) 고객센터(1688-3000)으로 문의해 주시기 바랍니다.",
					'0005' : "오류가 발생했습니다.(코드: 0005) 고객센터(1688-3000)으로 문의해 주시기 바랍니다.",
					'S' : "PRE-LDF PAY 다운로드가 완료되었습니다. 마이페이지 > 내 지갑에서 확인하실 수 있습니다.",
				};

				function completedButton(ele) { /* 버튼 다운로드 완료 처리 */
					ele.each(function(idx, val) {
						$(this).on('click', function(e) {
							e.preventDefault();
						}).css({
							pointerEvents: 'none',
							backgroundColor: 'rgba(255,255,255,0.5)',
						});
					});
				}

				function disabledButton(ele, msg) { /* 에러 관련 버튼 처리 */
					var alertMsg = msg;
					ele.each(function(idx, val) {
						$(this).on('click', function(e) {
							e.preventDefault();
							if (alertMsg) {
								alert(alertMsg);
							} else {
								alert('오류가 발생했습니다. 고객센터(1688-3000)으로 문의해 주시기 바랍니다.');
							}
						})
						;
					});
				}

				var preLdfPayList = getPreLdfPayCpnList(); /*데이타 존재 하는 경우만 셋팅 처리 */

				if (preLdfPayList && preLdfPayList != undefined) {

					$.each(preLdfPayList, function(idx, preLdfPay) {

						if (preLdfPay.cpnDownYn) {

							if (preLdfPay.cpnDownYn == 'N') { /* 다운로드 미완료 */

								var $codeBtn = $('[data-evt-code="'+ preLdfPay.evtCpnCd +'"]');

								if ($codeBtn.length) {

									if (preLdfPay.failCausDesc || (preLdfPay.codeMsg && preLdfPay.code != "S" )) {

										if (preLdfPay.failCausDesc && !preLdfPay.codeMsg) {
											disabledButton($codeBtn, evtCodeMsg[preLdfPay.failCausDesc]);
										} else {
											disabledButton($codeBtn, preLdfPay.codeMsg);
										}

									} else {

										$codeBtn.on('click', function(e) {
											e.preventDefault();

											var rst = setPreLdfPayCpnSbsc(preLdfPay.evtCpnCd);

											if (rst && rst.failCausDesc != '' && rst.failCausDesc != null) {

												if (evtCodeMsg[rst.failCausDesc]) {
													alert(evtCodeMsg[rst.failCausDesc]);
												} else {
													alert('존재하지 않는 오류 코드입니다.: ' + rst.failCausDesc);
												}

											} else if (rst && rst.code == 'S') {

												completedButton($codeBtn);
												alert(evtCodeMsg[rst.code]);

											} else if (rst && rst.codeMsg != '' && rst.codeMsg != null) {

												alert(rst.codeMsg);

											}

										});

									}

								}

							} else if (preLdfPay.cpnDownYn == 'Y') { /* 다운로드 완료  */

								var $codeBtn = $('[data-evt-code="'+ preLdfPay.evtCpnCd +'"]');

								if ($codeBtn.length) {
									completedButton($codeBtn);
								}

							}
						} else {

							if (preLdfPay.failCausDesc && !preLdfPay.codeMsg) {
								if (preLdfPay.failCausDesc == '0099') {
									disabledButton($('[data-evt-code]'), 'PRE-LDF PAY 행사 정보가 없습니다. 고객센터(1688-3000)으로 문의해 주시기 바랍니다.');
								} else {
									disabledButton($('[data-evt-code]'), 'PRE-LDF PAY 조회 오류 - ' + preLdfPay.failCausDesc + '- 고객센터(1688-3000)으로 문의해 주시기 바랍니다.');
								}
							} else {
								disabledButton($('[data-evt-code]'), preLdfPay.codeMsg);
							}

						}

					});
				} else {
					disabledButton($('[data-evt-code]'), 'PRE-LDF PAY 조회에 실패하였습니다. 고객센터(1688-3000)으로 문의해 주시기 바랍니다.');
				}
			})();
		</script>
