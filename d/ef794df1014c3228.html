	$(document).ready(function() {

		var allPrdCode = [
			{
				"prd_1": [
					{prdNo:'20001028277', prdOptNo:'20001405091'},
					{prdNo:'20001028218', prdOptNo:'20001404966'},
					{prdNo:'20000939709', prdOptNo:'20001244888'},
					{prdNo:'20000939662', prdOptNo:'20001244763'},
					{prdNo:'20000946008', prdOptNo:'20001256135'},
					{prdNo:'20000958945', prdOptNo:'20001277541'},
					{prdNo:'20000984696', prdOptNo:'20001327650'},
					{prdNo:'20000972827', prdOptNo:'20001303399'},
					{prdNo:'20000844153', prdOptNo:'20001089018'},
					{prdNo:'20001009923', prdOptNo:'20001373004'},
				],
				"prd_2": [
					{prdNo:'20001075282', prdOptNo:'20001497364'},
					{prdNo:'20001075313', prdOptNo:'20001497439'},
					{prdNo:'20001075322', prdOptNo:'20001497465'},

					{prdNo:'20001072941', prdOptNo:'20001492478'},
					{prdNo:'20001073945', prdOptNo:'20001494634'},
				],
				"prd_3": [
					{prdNo:'20001028221', prdOptNo:'20001404970'},
					{prdNo:'20001067907', prdOptNo:'20001482676'},
					{prdNo:'20001003533', prdOptNo:'20001361517'},
					{prdNo:'20000942724', prdOptNo:'20001251493'},
					{prdNo:'20000967923', prdOptNo:'20001294329'},
					{prdNo:'20000837795', prdOptNo:'20001079417'},
					{prdNo:'20001044080', prdOptNo:'20001438120'},
				],
				"prd_4": [
					{prdNo:'20001028277', prdOptNo:'20001405091'},
					{prdNo:'20000939709', prdOptNo:'20001244888'},
					{prdNo:'20000946008', prdOptNo:'20001256135'},
					{prdNo:'20000984696', prdOptNo:'20001327650'},
					{prdNo:'20000844153', prdOptNo:'20001089018'},
					{prdNo:'20001019042', prdOptNo:'20001388893'},
				],
			}
		];

		/*
			면세점 API 호출용 데이터 생성
		 */
		var ajaxData = function() {

			var prdInfoArr = [];

			for (var key in allPrdCode[0]) {
				if (allPrdCode[0].hasOwnProperty(key)) {

					var items = allPrdCode[0][key];

					if (Array.isArray(items)) {
						for (var i = 0; i < items.length; i++) {

							var item = items[i];
							var ajaxItem = {};

							for (var prop in item) {
								var excluded = ['custom', 'add', 'cate', 'empty', 'hide', 'change', 'addClass', 'addAttr', 'imgSizeX', 'noDims', 'showDate', 'wait'];

								if (item.hasOwnProperty(prop) && !excluded.includes(prop)) {
									ajaxItem[prop] = item[prop];
								}
							}

							if (Object.keys(ajaxItem).length > 0) {
								prdInfoArr.push(ajaxItem);
							}

							/* prdInfoArr.push(ajaxItem); */

						}
					}
				}
			}

			return prdInfoArr;

		}();

		window['_evtPrdAllCode'] = {
			prdInfo: ajaxData,
		};

		/*
			면세점 API 호출 후 실행할 함수
		 */
		window['_evtMakePrdList'] = function(ajaxRowData) {

			var $eventArea = $('.evWrap');
			var realPrdData = {};

			/*
				호출된 데이터를 바로 출력할 수 없기에 다시 한번 매칭용 데이터로 가공합니다.
				응답으로 받은 상품 리스트는 지정한 순서를 보장하지 않아 따로 매칭데이터가 필요합니다.
			 */
			$.each(ajaxRowData, function(idx, val) {

				var prdId = 'prd_' + val.prdNo + '_' + (val.prdOptNo ? val.prdOptNo : '0'); /* 상품No와 옵션No로 구분됩니다. */

				if (!(prdId in realPrdData)) {
					realPrdData[prdId] = val;
				} else {
					realPrdData['prd_unknown_idx_' + idx] = val;
				}
			});

			/* HTML 구조 생성 */
			$('._AUTO_SET').each(function(idx, val) {
				var $this = $(this);
				var $setWrap = $this.find('._AUTO_ITEM_WRAP').removeClass('_AUTO_ITEM_WRAP');
				var $setHtml = $('<div />');
				var $setHtmlTemp;

				var rowIdx = typeof $this.data('rowIdx') != 'undefined' ? $this.data('rowIdx') : idx;
				var itemCnt = 0;

				var fixedInfo = false;

				/* 임의 변경된 데이터를 찾아야 하기 때문에 원본 상품데이터를 돌려 상품을 출력합니다. */
				if (allPrdCode[0][rowIdx]) {

					/*
						한 열에 대한 스와이프가 필요한 경우, 그리고 슬라이드가 column 배치 상태일 때
						data-col-change 속성이 있는 경우 세로 열 배치에서 가로 행 배치로 변환합니다.

						변환 전: data-row-items="3" 일 때
						1 | 4 | 7,
						2 | 5 | 8,
						3 | 6 | 9, ...

						변환 후: data-row-items="3" 이고, data-col-change="3" 이면
						1 | 2 | 3,
						4 | 5 | 6,
						7 | 8 | 9, ...
					 */
					if ($this.find('._AUTO_ITEM_OBJ').data('colChange')) {
						var colData = [];
						var colCnt = 0;

						var rowLen = $this.find('._AUTO_ITEM_OBJ').data('rowItems');
						var colLen = $this.find('._AUTO_ITEM_OBJ').data('colChange');

						var itemLen = allPrdCode[0][rowIdx].length;
						var actualColLen = Math.min(colLen, Math.ceil(itemLen / rowLen));

						$.each(allPrdCode[0][rowIdx], function(cidx, cval) {

							colData[(cidx % actualColLen * rowLen) + colCnt] = cval;

							if ((cidx % actualColLen * rowLen) == (rowLen * (actualColLen - 1))) {
								colCnt++;
							}

						});

						$.each(colData, function(cidx, cval) {

							if (!cval) {
								colData[cidx] = {empty:true};
							}

						});

						allPrdCode[0][rowIdx] = colData;
					}

					if (!$this.find('._AUTO_ITEM_OBJ').data('position')) {
						/*
							누락된 상품이 있는지 검사
							아래 영역은 빈 상품을 제거할 때 사용됩니다.
							상품의 정렬 순서가 빈 요소 상태로라도 보장되어야 할 경우에는 사용하지 말아주세요.
						 */
						$.each(allPrdCode[0][rowIdx], function(ckey, cval) {

							if (cval?.empty || !cval) {
								return true;
							}

							var prdCode = 'prd_' + cval.prdNo + '_' + (cval.prdOptNo ? cval.prdOptNo : '0');
							if (!(prdCode in realPrdData)) {
								console.error('누락된 상품이 존재합니다.\ncate:' + rowIdx + '\nidx:' + ckey + '\nprdNo:' + cval.prdNo);
							}
						});

						/*
							상품 정보를 불러올 수 없는 경우 상품 데이터에서 제거 합니다.
							아래 영역은 빈 상품을 제거할 때 사용됩니다.
							상품의 정렬 순서가 빈 요소 상태로라도 보장되어야 할 경우에는 사용하지 말아주세요.
						 */
						allPrdCode[0][rowIdx] = allPrdCode[0][rowIdx].filter(function(cval){

							if (cval.empty) {
								return true;
							}

							var prdCode = 'prd_' + cval.prdNo + '_' + (cval.prdOptNo ? cval.prdOptNo : '0');
							return (prdCode in realPrdData);
						});
					}

					/*
						날짜 설정으로 상품을 노출하거나 제거할 수 있습니다.
						data-show-date="true"

						{prdNo:'20000446879', prdOptNo:'20000484357',
							showDate:{
								start: '2025/11/02 00:00:00',
								end: '2025/11/03 23:59:59',
							}
						},

					 */
					if ($this.find('._AUTO_ITEM_OBJ').data('showDate')) {

						allPrdCode[0][rowIdx] = allPrdCode[0][rowIdx].filter(function(cval){

							if (cval.showDate) {
								var nowDate = new Date();
								var startDate = new Date(cval.showDate.start);
								var endDate = new Date(cval.showDate.end);

								if (nowDate > startDate && nowDate < endDate) {
									return true;
								} else {
									return false;
								}
							} else {
								return true;
							}

						});

					}

					if ($this.find('._AUTO_ITEM_OBJ').data('fixedinfo')) {
						/*
							임의 셋팅된 상품정보가 실제 노출되는 상품 API 객체가 없을 경우 출력 리스트에서 제거됩니다.
							출력 리스트에서 유지하려면 이 옵션을 적용해주세요.
							실제 API 객체가 없을 경우 부모요소 ._remove_sec를 찾아 html 제거합니다.
							prd_25120002 행사 참고
						 */
						fixedInfo = true;
					}

					$.each(allPrdCode[0][rowIdx], function(ckey, cval) {

						var $setItemHtml = $this.find('._AUTO_ITEM').clone().removeClass('_AUTO_ITEM');

						var prdCode = 'prd_' + cval.prdNo + '_' + (cval.prdOptNo ? cval.prdOptNo : '0');
						var cateStr = '0';

						if ('cate' in cval) { /* 필터 그룹 지정시 인덱스 및 문자열을 지정합니다. */
							cateStr = cval.cate;
						}

						function setHtmlItem() {

							if ('add' in cval) { /* 임의 추가된 항목을 삽입 합니다. */
								$.each(cval.add, function(k, v) {
									realPrdData[prdCode][k] = v;
								});
							}

							if ('custom' in cval) { /* 임의 변경된 항목에 대해 값을 갱신 합니다. */
								$.each(cval.custom, function(k, v) {
									realPrdData[prdCode][k] = v;
								});
							}

							$setItemHtml.find('[data-auto-ipg]').each(function(i, v) {

								var autoType = $(this).data().autoIpg;
								var prdData = realPrdData[prdCode];

								function createText(currentData, dataName, $ele) {
									if (currentData.hide && currentData.hide[dataName]) {
										$ele.parent().html('').addClass('_disabled');
									} else {
										if (currentData.change && currentData.change[dataName]) {
											$ele.html(currentData.change[dataName]);
										} else {
											if (prdData[dataName] == '0') { /* 데이터값이 0인 경우 숨김 처리 */
												$ele.parent().html('').addClass('_disabled');
											} else {
												if (prdData[dataName]) {
													$ele.html(prdData[dataName]);
												} else {
													$ele.closest('._remove_sec').remove();
												}
											}
										}
									}
								}

								switch (autoType) {
								case 'img' :
									if (cval?.change && cval?.change?.prdImgUrl) {
										$(this).attr('src', cval.change.prdImgUrl);
									} else {
										if (cval.noDims) {
											$(this).attr('src', realPrdData[prdCode].prdImgUrl);
										} else {
											if (realPrdData[prdCode].prdImgUrl) {
												$(this).attr('src', realPrdData[prdCode].prdImgUrl + '/dims/resize/460x460');
											} else {
												$(this).attr('src', 'https://static.lottedfs.com/static-fo-pc/images/noimg/noImgSize_43x38.png');

											}
										}
									}

									if (cval.imgSizeX) {
										$(this).css('width', cval.imgSizeX);
									}

									break;
								case 'link' :
									if (cval.wait) {
										$(this).attr({href: '#', onclick: 'alert("'+ cval.wait +'"); return false;'});
									} else {
										$(this).attr('href', 'https://kor.lottedfs.com/kr/product/productDetail?prdNo='+ realPrdData[prdCode].prdNo +'&prdOptNo=' + realPrdData[prdCode].prdOptNo + '&adltPrdYn=' + realPrdData[prdCode].adltPrdYn);
									}
									break;
								case 'brand' :
									var dataName = 'brndNm';

									/* 항목별로 적용할 수 있습니다. */
									createText(cval, dataName, $(this));
									break;
								case 'prdName' :
									var dataName = 'prdNm';
									createText(cval, dataName, $(this));
									break;
								case 'prdPer' :
									var dataName = 'dscntRt';
									createText(cval, dataName, $(this));
									break;
								case 'prdDel' :
									var dataName = 'saleUntPrc';
									createText(cval, dataName, $(this));
									break;
								case 'prdPrice' :
									var dataName = 'dscntAmt';
									createText(cval, dataName, $(this));
									break;
								default:

								}

							});
						}

						function addRowItem(hide, empty) {

							if ($this.find('._AUTO_ITEM_OBJ').data('rowItems')) {
								if (itemCnt % $this.find('._AUTO_ITEM_OBJ').data('rowItems') == 0) {
									$setHtmlTemp = $this.find('._AUTO_ITEM_OBJ').clone().removeClass('_AUTO_ITEM_OBJ').addClass('_item_row').html('');
									$setItemHtml.appendTo($setHtmlTemp);
									$setHtml.append($setHtmlTemp);

									$setHtmlTemp.attr({
										'data-item-cate': cateStr,
										'data-item-idx': $setHtml.find('._item_obj').length,
									});

								} else {
									$setItemHtml.appendTo($setHtmlTemp);
								}

								if (hide) {
									$setItemHtml.addClass('_delete');
								}

								if (empty) {
									$setItemHtml.addClass('_empty');
								}

								if ('addAttr' in cval) {
									$.each(cval.addAttr, function(i, v) {
										$.each(v, function(k, kv) {
											$setItemHtml.attr(String(k), String(kv));
										});
									});
								}

							} else {
								$setHtmlTemp = $this.find('._AUTO_ITEM_OBJ').clone().removeClass('_AUTO_ITEM_OBJ').addClass('_item_single').html('');
								$setItemHtml.appendTo($setHtmlTemp);
								$setHtml.append($setHtmlTemp);

								$setHtmlTemp.attr({
									'data-item-cate': cateStr,
									'data-item-idx': $setHtml.find('._item_obj').length,
								});

								if (hide) {
									$setHtmlTemp.addClass('_delete');
								}

								if (empty) {
									$setHtmlTemp.addClass('_empty');
								}

								if ('addAttr' in cval) {
									$.each(cval.addAttr, function(i, v) {
										$.each(v, function(k, kv) {
											$setHtmlTemp.attr(String(k), String(kv));
										});
									});
								}
							}

							if ('addClass' in cval) {
								$setItemHtml.addClass(cval.addClass);
							}

						}

						if (!cval.empty) {

							if (prdCode in realPrdData) {

								setHtmlItem();

								addRowItem();

								itemCnt++;

							} else {

								var prdCodeDepth = prdCode.split('_').slice(0, 2).join('_');

								var defaultItemIf = false;

								$.each(realPrdData, function(k, v) { /* 상품 옵션 코드가 없을 경우 첫번째 옵션코드를 임의로 선택합니다. */
									if (k.indexOf(prdCodeDepth) === 0) {
										defaultItemIf = true;
										prdCode = k;
										return false;
									}
								});

								if (defaultItemIf) {

									setHtmlItem();

									addRowItem();

									itemCnt++;

								} else {

									if (fixedInfo) {
										realPrdData[prdCode] = {};
										setHtmlItem();
										addRowItem();
									} else {
										$setItemHtml.html('');
										addRowItem(true, false);
									}

									itemCnt++;

								}

								console.error('누락된 상품이 존재합니다.\ncate:' + rowIdx + '\nidx:' + ckey + '\nprdNo:' + cval.prdNo);

							}

						} else {

							$setItemHtml.html('');

							addRowItem(false, true);

							itemCnt++;
						}

					});

					$setWrap.html($setHtml.html());

					$this.addClass('_init');

				} else {
					console.error('누락된 리스트 항목이 존재합니다.\nidx:' + idx, val);
				}

			});

			/* 상품 슬라이드 실행 */
			$.each($eventArea.find('._sec_item_list'), function(idx, val) {

				var nowIdx = idx;

				var $this = $(this);

				if ($this.find('._item').length < 6) {
					$this.find('._slide_btn_next, ._slide_btn_prev').remove();
				}

				if (!window['_productSlider_' + nowIdx]) {
					window['_productSlider_' + nowIdx] = new Swiper($this.find('._list_slider')[0], {
						effect: 'slide',
